name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, mbstring, fileinfo, json
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-dev --prefer-dist --no-progress

      - name: Lint PHP files
        run: find app config public -name '*.php' -print0 | xargs -0 -n1 php -l

      # Once, on 8.4 only: phpstan.neon already targets phpVersion 8.1. Dev tools are
      # installed only here; the other versions test the --no-dev install as shipped.
      - name: Install dev tools
        if: matrix.php == '8.4'
        run: composer install --prefer-dist --no-progress

      - name: Static analysis
        if: matrix.php == '8.4'
        run: vendor/bin/phpstan analyse --no-progress

      - name: Run tests
        run: php tests/run.php
