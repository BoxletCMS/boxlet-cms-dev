name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    name: PHP ${{ matrix.php }}

    # A throwaway MySQL per job, so the suite runs against both drivers.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: boxlet_test
          MYSQL_USER: boxlet
          MYSQL_PASSWORD: boxlet
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      TEST_MYSQL_HOST: 127.0.0.1
      TEST_MYSQL_PORT: 3306
      TEST_MYSQL_DATABASE: boxlet_test
      TEST_MYSQL_USERNAME: boxlet
      TEST_MYSQL_PASSWORD: boxlet
      # A MySQL test that skips is a failure here, not a silent pass.
      TEST_REQUIRE_MYSQL: 1

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, pdo_mysql, mbstring, fileinfo, json
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-dev --prefer-dist --no-progress

      - name: Lint PHP files
        run: find app config public lang -name '*.php' -print0 | xargs -0 -n1 php -l

      # Once, on 8.4 only: phpstan.neon already targets phpVersion 8.1. Dev tools are
      # installed only here; the other versions test the --no-dev install as shipped.
      - name: Install dev tools
        if: matrix.php == '8.4'
        run: composer install --prefer-dist --no-progress

      - name: Static analysis
        if: matrix.php == '8.4'
        run: vendor/bin/phpstan analyse --no-progress

      - name: Run tests
        run: php tests/run.php
